name: CI

# Every check the project documents, on every pull request and on main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Type check, unit tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  pipeline:
    name: Python pipeline tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: processing/requirements.txt
      - run: pip install -r processing/requirements.txt
      # Tests that need the raw NISAR granules or NASA's sample files skip themselves when those are absent.
      - run: python -m pytest tests

  browser:
    name: Browser tests (offline policy, accessibility, phone)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: processing/requirements.txt
      - run: pip install -r processing/requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Build the synthetic fixture and the app
        run: |
          python tests/integration/build_fixture.py
          cd frontend && npm run build
      # The suite defaults to the system Edge, which a Linux runner does not have: point it at Playwright's Chromium instead.
      - name: Run the browser tests
        working-directory: frontend
        env:
          CL_PERF_SLACK: 3 # Shared runners are not a performance benchmark; the limits stay strict on a developer's machine
        run: |
          export CL_BROWSER_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          npx playwright test --trace off
